name: build-release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev zlib1g-dev libgl1-mesa-dev
      - name: Dependencias (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 zlib
      - name: Dependencias (Windows, vcpkg estatico)
        if: runner.os == 'Windows'
        run: C:\vcpkg\vcpkg.exe install sdl2:x64-windows-static zlib:x64-windows-static
      - name: Configurar e compilar (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static
          cmake --build build --config Release
      - name: Configurar e compilar (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Empacotar
        shell: bash
        run: |
          mkdir -p pkg
          if [ "${{ runner.os }}" = "Windows" ]; then cp build/Release/piu.exe pkg/piu.exe; cp build/Release/piu_pc.exe pkg/piu_pc.exe; cp jogar.bat pkg/; else cp build/piu pkg/piu; cp build/piu_pc pkg/piu_pc; fi
          cp README.md LogoIA.png icon.png pkg/
          cd pkg
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a ../PiuReconstructed-${{ matrix.name }}.zip . ; else tar czf ../PiuReconstructed-${{ matrix.name }}.tar.gz . ; fi
      - name: Enviar artefato (tentativa 1)
        id: up1
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: PiuReconstructed-${{ matrix.name }}.*
          overwrite: true
      - name: Enviar artefato (tentativa 2)
        if: steps.up1.outcome == 'failure'
        id: up2
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: PiuReconstructed-${{ matrix.name }}.*
          overwrite: true
      - name: Enviar artefato (tentativa 3)
        if: steps.up1.outcome == 'failure' && steps.up2.outcome == 'failure'
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: PiuReconstructed-${{ matrix.name }}.*
          overwrite: true
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
